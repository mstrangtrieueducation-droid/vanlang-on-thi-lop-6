<!doctype html><html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Bộ tranh 3D · MS TRANG TRIEU EDUCATION</title>
<style>body{margin:0;padding:24px;background:#f1f5fc;color:#17344c;font:16px system-ui,sans-serif}header,footer{max-width:1200px;margin:auto}h1{margin:8px 0}nav{display:flex;gap:10px;margin:20px 0;flex-wrap:wrap}button,a{padding:12px 18px;border:0;border-radius:12px;background:#233c82;color:white;font:inherit;cursor:pointer}button[aria-pressed=true]{background:#644bd5}main{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:18px;max-width:1200px;margin:auto}figure{margin:0;padding:14px;background:white;border-radius:18px;box-shadow:0 5px 20px #254f7410}img{display:block;width:100%;aspect-ratio:1;object-fit:contain;background:radial-gradient(#f4f0ff,#fff)}figcaption{text-align:center;font-weight:700;padding:12px 0 2px}small{display:block;color:#586a80;font-weight:400}footer{margin:30px auto}</style></head>
<body><header><small>MS TRANG TRIEU EDUCATION · BẢN DUYỆT TRANH</small><h1>Bộ tranh 3D nền trong suốt</h1><p>Đồ vật, nhân vật và tình huống minh họa dùng trong bài nghe, nhìn tranh và nối từ.</p><nav><button data-book="1" aria-pressed="true">Family and Friends 1</button><button data-book="2" aria-pressed="false">Family and Friends 2</button><button data-book="phonics" aria-pressed="false">Phonics 1–4</button><a href="../vu-tru/?review=1">Vào game ↗</a></nav></header><main aria-live="polite"><p>Đang mở bộ tranh mới…</p></main><footer>Nhãn từ ở trang này dành cho cô và đội ngũ duyệt nội dung; bài luyện nghe không hiện chữ đáp án.</footer>
<script>Promise.all([fetch('../game-kit/adventures/pictures/family-cards/3d-v3/manifest.json').then(r=>r.json()),fetch('../game-kit/clay-art.json?v=clay-1').then(r=>r.json()),fetch('../game-kit/clay-art-aliases.json?v=clay-1').then(r=>r.json())]).then(([m,art,aliases])=>{const root=document.querySelector('main');function show(book){root.replaceChildren();const entries=book==='phonics'?[...new Set(Object.values(aliases))].sort().map(word=>[word,art[word],'Phonics']):Object.entries(m.items).filter(([key])=>key.startsWith(book+':')).map(([key,p])=>[key.split(':').slice(2).join(':'),art[p.semantic||key.split(':').slice(2).join(':')],'Unit '+key.split(':')[1]]);for(const [word,p,label]of entries){if(!p)continue;const f=document.createElement('figure'),i=document.createElement('img'),c=document.createElement('figcaption'),s=document.createElement('small');i.src=p.src;i.alt=word;i.width=300;i.height=300;i.loading='lazy';i.decoding='async';c.textContent=word==='fish-live'?'fish':word;s.textContent=label;c.append(s);f.append(i,c);root.append(f);}document.querySelectorAll('button').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.book===book)));}document.querySelectorAll('button').forEach(b=>b.onclick=()=>show(b.dataset.book));show('1');}).catch(()=>document.querySelector('main').textContent='Chưa tải được bộ tranh. Cô tải lại trang giúp em nhé.');</script></body></html>
