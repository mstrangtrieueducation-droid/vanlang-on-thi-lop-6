<!doctype html><html lang="vi"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Bộ tranh FF 1–2 · MS TRANG TRIEU EDUCATION</title>
<style>body{margin:0;padding:24px;background:#f1f5fc;color:#17344c;font:16px system-ui,sans-serif}header{max-width:1200px;margin:auto}h1{margin:8px 0}nav{display:flex;gap:10px;margin:20px 0;flex-wrap:wrap}button,a{padding:12px 18px;border:0;border-radius:12px;background:#233c82;color:white;font:inherit;cursor:pointer}button[aria-pressed=true]{background:#644bd5}main{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:18px;max-width:1200px;margin:auto}figure{margin:0;padding:14px;background:white;border-radius:18px;box-shadow:0 5px 20px #254f7410}i{display:block;aspect-ratio:1;background-repeat:no-repeat;background-size:300% 400%}figcaption{text-align:center;font-weight:700;padding:12px 0 2px}small{display:block;color:#586a80;font-weight:400}footer{max-width:1200px;margin:30px auto}</style>
<header><small>MS TRANG TRIEU EDUCATION · BẢN DUYỆT TRANH</small><h1>Family and Friends · Bộ tranh 3D</h1><p>Tranh minh họa mới dùng trong bài nghe, nhìn tranh, nối từ và bài kiểm tra.</p><nav><button data-book="1" aria-pressed="true">Family and Friends 1</button><button data-book="2" aria-pressed="false">Family and Friends 2</button><a href="../vu-tru/?review=1&course=family-friends-1&view=map">Vào game ↗</a></nav></header><main></main><footer>Tranh không có chữ đáp án trong bài của học sinh. Các nhãn ở trang này chỉ dành cho cô và đội ngũ duyệt nội dung.</footer>
<script>fetch('../game-kit/adventures/pictures/family-cards/3d-v3/manifest.json').then(r=>r.json()).then(m=>{const root=document.querySelector('main');function show(book){root.replaceChildren();for(const [key,p]of Object.entries(m.items)){if(!key.startsWith(book+':'))continue;const [b,u,word]=key.split(':'),f=document.createElement('figure'),i=document.createElement('i'),c=document.createElement('figcaption'),s=document.createElement('small');i.style.backgroundImage=`url('${p.atlas}')`;i.style.backgroundPosition=`${p.cell%3*50}% ${Math.floor(p.cell/3)*100/3}%`;i.style.aspectRatio=p.cellAspect;c.textContent=word;s.textContent='Unit '+u;c.append(s);f.append(i,c);root.append(f);}document.querySelectorAll('button').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.book===book)));}document.querySelectorAll('button').forEach(b=>b.onclick=()=>show(b.dataset.book));show('1');}).catch(()=>document.querySelector('main').textContent='Chưa tải được bộ tranh. Cô tải lại trang nhé.');</script></html>
