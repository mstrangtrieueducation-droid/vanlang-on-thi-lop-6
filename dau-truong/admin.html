<!doctype html><html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Cấp mã học sinh · Văn Lang</title><link rel="stylesheet" href="../game-kit/adventures/style.css"><link rel="stylesheet" href="arena.css"></head><body><main id="arena"><header><div class="brand"><b>Cô giáo · Cấp mã đấu trường</b></div><a href="./">Về đấu trường</a></header><section id="content"><h1>Tạo mã riêng cho học sinh</h1><p>Chỉ dùng biệt danh trên bảng xếp hạng. Mã học sinh là chìa khóa vào hồ sơ, cô gửi riêng cho từng bạn.</p><form class="login-box"><label>Mã quản trị<input id="admin" type="password" autocomplete="off" required></label><label>Biệt danh trên bảng xếp hạng<input id="alias" maxlength="24" minlength="2" required></label><button class="primary">Cấp mã học sinh</button></form><p id="status" role="status"></p><div id="issued"></div></section></main><script src="config.js"></script><script>
const base=window.GAME_ONLINE.apiBase||(location.hostname==='127.0.0.1'?'http://127.0.0.1:8793':'');document.querySelector('form').onsubmit=async e=>{e.preventDefault();const status=document.querySelector('#status'),issued=document.querySelector('#issued'),button=e.currentTarget.querySelector('button');issued.replaceChildren();if(!base){status.textContent='Chưa kết nối máy chủ. Trang chưa cấp mã thật.';return;}button.disabled=true;try{const r=await fetch(base+'/admin/enroll',{method:'POST',headers:{'Content-Type':'application/json',Authorization:'Bearer '+document.querySelector('#admin').value},body:JSON.stringify({alias:document.querySelector('#alias').value})});const d=await r.json();if(!r.ok)throw Error(d.error);status.textContent='Đã tạo mã cho '+d.alias+'. Cô lưu và gửi riêng mã này; máy chủ không lưu bản rõ để đọc lại.';const p=document.createElement('p');p.className='code';p.textContent=d.code;issued.append(p);}catch(err){status.textContent=err.message;}finally{button.disabled=false;}};
</script></body></html>
